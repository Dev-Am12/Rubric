# Authorization expectations — the machine-readable twin of AUTHZ.md §3.
# This file is loaded by the route×role coverage test (AUTHZ.md §4).
#
# Every route discovered via URLconf introspection MUST have an entry here,
# or the build fails.  This is what makes "I added a route at 3am without
# thinking about authz" a build error, not a security hole.
#
# Format:
#   route_name:
#     declared: true/false
#     note: optional explanation
#
# Routes with declared=false MUST be removed before submission freeze
# (PLAN.md §5.6).  Their only purpose is to prove the coverage test
# itself can catch undeclared routes (AUTHZ.md §4, control case).

# -----------------------------------------------------------------------
# Control case: the deliberately-leaky test-only route (AUTHZ.md §4).
# This route has NO policy check.  It exists purely so the authz coverage
# test can prove it catches an undeclared route.  REMOVE BEFORE FREEZE.
# -----------------------------------------------------------------------
debug_leaky_scores:
  declared: true
  note: >
    INTENTIONALLY UNDECLARED IN AUTHZ.md §3 — this is the control case.
    It has no policy check at all.  The coverage test should catch it as
    "present in URLconf but with no real authorization."
    TODO: Remove this route and this entry before submission (PLAN §5.6).

# -----------------------------------------------------------------------
# P-11 routes (API.md §1, .dogfood.toml, AUTHZ.md §3)
# Exact paths registered from day one. In G1 Step 2, these point to 200
# placeholder views. Full authorization and business logic wired at G2/G3/G4.
# -----------------------------------------------------------------------
gallery:
  declared: true
  path: /projects
  method: GET
  auth: public
  note: >
    P-11 public project gallery (API.md §2). In G2, shows submitted
    projects only (AUTHZ.md §3.1, D-13). Public read.

submit:
  declared: true
  path: /projects/new
  method: GET, POST
  auth: participant
  note: >
    P-11 project submission (API.md §2, UX.md §1). Requires participant
    actor for their own team while submissions are open (AUTHZ.md §3.1).

project_detail:
  declared: true
  path: /projects/{id}
  method: GET
  auth: public_if_submitted_else_owner_or_organizer
  note: >
    Project detail (API.md §2, UX.md §1). Public if status=SUBMITTED;
    draft submissions visible only to team members and organizers (AUTHZ.md §3.1).

project_edit:
  declared: true
  path: /projects/{id}/edit
  method: GET, POST
  auth: participant_owner
  note: >
    Edit project submission (UX.md §1, API.md §2). Team members and organizers
    can edit before the event deadline.

my_submissions:
  declared: true
  path: /my/submissions
  method: GET
  auth: participant
  note: >
    Participant own submissions list (UX.md §1). Shows team's projects and
    displays the duplicate-flag banner when is_duplicate_of is set.

judge_scores:
  declared: true
  path: /api/judge/scores
  method: GET
  auth: judge_or_organizer
  note: >
    P-11 judge own scores (API.md §2). In G3, returns ballots for the
    requesting judge, or all ballots if organizer (AUTHZ.md §3.2, F1).

peer_scores:
  declared: true
  path: /api/judge/scores?judge=jdg_07
  method: GET
  auth: organizer_only_if_different_judge
  note: >
    P-11 peer scores isolation probe (API.md §2, with ?judge= param).
    In G3, judges cannot see another judge's scores (403); only
    organizers can inspect peer scores (AUTHZ.md §3.2, spec.md trap).

csv_export:
  declared: true
  path: /api/export.csv
  method: GET
  auth: organizer
  note: >
    P-11 CSV export of final rankings and scores (API.md §2). In G4,
    organizer-only export endpoint (AUTHZ.md §3.2).

ballot_submit:
  declared: true
  path: /api/v1/ballots/{assignment_id}
  method: POST
  auth: assigned_judge
  note: Judge may submit only their own assignment (AUTHZ.md §3.2).

organizer_progress:
  declared: true
  path: /api/v1/organizer/progress
  method: GET
  auth: organizer
  note: Minimal completed-project count for the G3 progress service.

judge_queue:
  declared: true
  path: /judge/queue
  method: GET
  auth: judge
  note: >
    Judge assignment queue (UX.md §1, AUTHZ.md §3.2). Shows assigned projects
    for the requesting judge only.

judge_ballot:
  declared: true
  path: /judge/ballots/{assignment_id}
  method: GET, POST
  auth: assigned_judge
  note: >
    Two-pane ballot scoring screen (UX.md §2, AUTHZ.md §3.2). Accessible only to
    the judge assigned to this assignment.

judge_ballot_autosave:
  declared: true
  path: /judge/ballots/{assignment_id}/autosave
  method: POST
  auth: assigned_judge
  note: >
    HTMX autosave for in-progress scoring (UX.md §2). Accessible only to the
    judge assigned to this assignment.

organizer_progress_page:
  declared: true
  path: /organizer/progress
  method: GET
  auth: organizer
  note: >
    Organizer progress dashboard UI (UX.md §1, §3). Shows project review
    completion numbers.

organizer_dashboard:
  declared: true
  path: /organizer
  method: GET, POST
  auth: organizer
  note: >
    Organizer dashboard UI (UX.md §3). Displays live review progress,
    track under-coverage, graph health metrics, and integrity flags with
    duplicate-restore action.

organizer_assignments:
  declared: true
  path: /organizer/assignments
  method: GET, POST
  auth: organizer
  note: >
    Organizer assignments management (UX.md §1, API.md §2). Trigger
    assignment runs and inspect AssignmentRun history and graph connectivity.

organizer_normalization:
  declared: true
  path: /organizer/normalization
  method: GET, POST
  auth: organizer
  note: >
    Organizer normalization proof view (UX.md §1, §3, API.md §2). Trigger
    normalization runs and view the deterministic raw/normalized/rank-change table.

organizer_audit_log_page:
  declared: true
  path: /organizer/audit-log
  method: GET
  auth: organizer
  note: >
    Organizer audit log viewer HTML interface with Verify button and export download.

organizer_audit_log:
  declared: true
  path: /api/v1/organizer/audit-log
  method: GET
  auth: organizer
  note: >
    Organizer audit log API endpoint. Paginated append-only audit entries.

organizer_audit_verify:
  declared: true
  path: /api/v1/organizer/audit-log/verify
  method: GET
  auth: organizer
  note: >
    Organizer audit log verification and export download endpoint.

organizer_rubric:
  declared: true
  path: /organizer/rubric
  method: GET, POST
  auth: organizer
  note: >
    Organizer rubric configuration and inspection interface (T2 requirement).

register:
  declared: true
  path: /accounts/register
  method: GET, POST
  auth: public
  note: >
    User registration form and account creation endpoint (API.md §3).

login:
  declared: true
  path: /login
  method: GET, POST
  auth: public
  note: >
    User authentication form and session token issue endpoint (API.md §3).

accounts_login:
  declared: true
  path: /accounts/login
  method: GET, POST
  auth: public
  note: >
    Canonical /accounts/login alias for user login.

logout:
  declared: true
  path: /logout
  method: GET, POST
  auth: public
  note: >
    User session invalidation and cookie clearing endpoint.

accounts_logout:
  declared: true
  path: /accounts/logout
  method: GET, POST
  auth: public
  note: >
    Canonical /accounts/logout alias for user logout.

# -----------------------------------------------------------------------
# G5.7 Event management & public landing page routes
# -----------------------------------------------------------------------
landing_page:
  declared: true
  path: /
  method: GET
  auth: public
  note: >
    Public landing page showing current event details, tracks, prizes, and portal links.

organizer_events:
  declared: true
  path: /organizer/events
  method: GET, POST
  auth: organizer
  note: >
    Organizer event management dashboard: list all events and create new events.

organizer_event_dates:
  declared: true
  path: /organizer/events/{event_id}/dates
  method: GET, POST
  auth: organizer
  note: >
    Organizer interface to edit event name, slug, and submission/voting dates.

organizer_event_tracks:
  declared: true
  path: /organizer/events/{event_id}/tracks
  method: GET, POST
  auth: organizer
  note: >
    Organizer interface to list and add tracks for an event.

organizer_event_track_edit:
  declared: true
  path: /organizer/events/{event_id}/tracks/{track_id}
  method: POST
  auth: organizer
  note: >
    Organizer endpoint to edit track details.

organizer_event_prizes:
  declared: true
  path: /organizer/events/{event_id}/prizes
  method: GET, POST
  auth: organizer
  note: >
    Organizer interface to list and add prizes for an event.

organizer_event_prize_edit:
  declared: true
  path: /organizer/events/{event_id}/prizes/{prize_id}
  method: POST
  auth: organizer
  note: >
    Organizer endpoint to edit prize details.

organizer_event_make_current:
  declared: true
  path: /organizer/events/{event_id}/make-current
  method: POST
  auth: organizer
  note: >
    Organizer action to explicitly switch the active/current event across the portal.


