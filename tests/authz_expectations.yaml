# Authorization expectations.
# This file is loaded by the route×role coverage test.
#
# Every route discovered via URLconf introspection MUST have an entry here,
# or the build fails.  This is what makes "I added a route at 3am without
# thinking about authz" a build error, not a security hole.
#
# Format:
#   route_name:
#     declared: true/false
#     note: optional explanation
#
# Routes with declared=false MUST be removed before submission freeze.
# Their only purpose is to prove the coverage test
# itself can catch undeclared routes.

# -----------------------------------------------------------------------
# P-11 routes (.dogfood.toml)
# Exact paths registered from day one. Full authorization and business logic wired.
# -----------------------------------------------------------------------
gallery:
  declared: true
  path: /projects
  method: GET
  auth: public
  note: >
    P-11 public project gallery. Shows submitted
    projects only. Public read.

submit:
  declared: true
  path: /projects/new
  method: GET, POST
  auth: participant
  note: >
    P-11 project submission. Requires participant
    actor for their own team while submissions are open.

project_detail:
  declared: true
  path: /projects/{id}
  method: GET
  auth: public_if_submitted_else_owner_or_organizer
  note: >
    Project detail. Public if status=SUBMITTED;
    draft submissions visible only to team members and organizers.

project_edit:
  declared: true
  path: /projects/{id}/edit
  method: GET, POST
  auth: participant_owner
  note: >
    Edit project submission. Team members and organizers
    can edit before the event deadline.

my_submissions:
  declared: true
  path: /my/submissions
  method: GET
  auth: participant
  note: >
    Participant own submissions list. Shows team's projects and
    displays the duplicate-flag banner when is_duplicate_of is set.

judge_scores:
  declared: true
  path: /api/judge/scores
  method: GET
  auth: judge_or_organizer
  note: >
    P-11 judge own scores. Returns ballots for the
    requesting judge, or all ballots if organizer.

peer_scores:
  declared: true
  path: /api/judge/scores?judge=jdg_07
  method: GET
  auth: organizer_only_if_different_judge
  note: >
    P-11 peer scores isolation probe (with ?judge= param).
    Judges cannot see another judge's scores (403); only
    organizers can inspect peer scores.

csv_export:
  declared: true
  path: /api/export.csv
  method: GET
  auth: organizer
  note: >
    P-11 CSV export of final rankings and scores.
    Organizer-only export endpoint.

ballot_submit:
  declared: true
  path: /api/v1/ballots/{assignment_id}
  method: POST
  auth: assigned_judge
  note: Judge may submit only their own assignment.

organizer_progress:
  declared: true
  path: /api/v1/organizer/progress
  method: GET
  auth: organizer
  note: Minimal completed-project count for the G3 progress service.

judge_queue:
  declared: true
  path: /judge/queue
  method: GET
  auth: judge
  note: >
    Judge assignment queue. Shows assigned projects
    for the requesting judge only.

judge_ballot:
  declared: true
  path: /judge/ballots/{assignment_id}
  method: GET, POST
  auth: assigned_judge
  note: >
    Two-pane ballot scoring screen. Accessible only to
    the judge assigned to this assignment.

judge_ballot_autosave:
  declared: true
  path: /judge/ballots/{assignment_id}/autosave
  method: POST
  auth: assigned_judge
  note: >
    HTMX autosave for in-progress scoring. Accessible only to the
    judge assigned to this assignment.

organizer_progress_page:
  declared: true
  path: /organizer/progress
  method: GET
  auth: organizer
  note: >
    Organizer progress dashboard UI. Shows project review
    completion numbers.

organizer_dashboard:
  declared: true
  path: /organizer
  method: GET, POST
  auth: organizer
  note: >
    Organizer dashboard UI. Displays live review progress,
    track under-coverage, graph health metrics, and integrity flags with
    duplicate-restore action.

organizer_assignments:
  declared: true
  path: /organizer/assignments
  method: GET, POST
  auth: organizer
  note: >
    Organizer assignments management. Trigger
    assignment runs and inspect AssignmentRun history and graph connectivity.

organizer_normalization:
  declared: true
  path: /organizer/normalization
  method: GET, POST
  auth: organizer
  note: >
    Organizer normalization proof view. Trigger
    normalization runs and view the deterministic raw/normalized/rank-change table.

organizer_audit_log_page:
  declared: true
  path: /organizer/audit-log
  method: GET
  auth: organizer
  note: >
    Organizer audit log viewer HTML interface with Verify button and export download.

organizer_audit_log:
  declared: true
  path: /api/v1/organizer/audit-log
  method: GET
  auth: organizer
  note: >
    Organizer audit log API endpoint. Paginated append-only audit entries.

organizer_audit_verify:
  declared: true
  path: /api/v1/organizer/audit-log/verify
  method: GET
  auth: organizer
  note: >
    Organizer audit log verification and export download endpoint.

organizer_rubric:
  declared: true
  path: /organizer/rubric
  method: GET, POST
  auth: organizer
  note: >
    Organizer rubric configuration and inspection interface (T2 requirement).

register:
  declared: true
  path: /accounts/register
  method: GET, POST
  auth: public
  note: >
    User registration form and account creation endpoint. Rate limited to 10 attempts / 5 minutes per IP (returns 429).

login:
  declared: true
  path: /login
  method: GET, POST
  auth: public
  note: >
    User authentication form and session token issue endpoint. Rate limited to 10 attempts / 5 minutes per IP (returns 429).

accounts_login:
  declared: true
  path: /accounts/login
  method: GET, POST
  auth: public
  note: >
    Canonical /accounts/login alias for user login.

logout:
  declared: true
  path: /logout
  method: GET, POST
  auth: public
  note: >
    User session invalidation and cookie clearing endpoint.

accounts_logout:
  declared: true
  path: /accounts/logout
  method: GET, POST
  auth: public
  note: >
    Canonical /accounts/logout alias for user logout.

# -----------------------------------------------------------------------
# G5.7 Event management & public landing page routes
# -----------------------------------------------------------------------
landing_page:
  declared: true
  path: /
  method: GET
  auth: public
  note: >
    Public landing page showing current event details, tracks, prizes, and portal links.

organizer_events:
  declared: true
  path: /organizer/events
  method: GET, POST
  auth: organizer
  note: >
    Organizer event management dashboard: list all events and create new events.

organizer_event_dates:
  declared: true
  path: /organizer/events/{event_id}/dates
  method: GET, POST
  auth: organizer
  note: >
    Organizer interface to edit event name, slug, and submission/voting dates.

organizer_event_tracks:
  declared: true
  path: /organizer/events/{event_id}/tracks
  method: GET, POST
  auth: organizer
  note: >
    Organizer interface to list and add tracks for an event.

organizer_event_track_edit:
  declared: true
  path: /organizer/events/{event_id}/tracks/{track_id}
  method: POST
  auth: organizer
  note: >
    Organizer endpoint to edit track details.

organizer_event_prizes:
  declared: true
  path: /organizer/events/{event_id}/prizes
  method: GET, POST
  auth: organizer
  note: >
    Organizer interface to list and add prizes for an event.

organizer_event_prize_edit:
  declared: true
  path: /organizer/events/{event_id}/prizes/{prize_id}
  method: POST
  auth: organizer
  note: >
    Organizer endpoint to edit prize details.

organizer_event_make_current:
  declared: true
  path: /organizer/events/{event_id}/make-current
  method: POST
  auth: organizer
  note: >
    Organizer action to explicitly switch the active/current event across the portal.

# -----------------------------------------------------------------------
# G5.8 Team invite links and judge invitation routes
# -----------------------------------------------------------------------
organizer_judges:
  declared: true
  path: /organizer/judges
  method: GET, POST
  auth: organizer
  note: >
    Organizer page to manage judges, issue 14-day one-time invite links by email + tracks.

judge_invite_accept:
  declared: true
  path: /invite/judge/{token}
  method: GET, POST
  auth: public
  note: >
    Judge invitation acceptance flow requiring matching authenticated email.

team_create:
  declared: true
  path: /teams/new
  method: GET, POST
  auth: public
  note: >
    Team creation endpoint (redirects anonymous to login with safe next parameter).

team_join:
  declared: true
  path: /teams/join/{code}
  method: GET
  auth: public
  note: >
    Team invite link join endpoint (redirects anonymous to login with safe next parameter).

team_detail:
  declared: true
  path: /teams/{id}
  method: GET
  auth: public
  note: >
    Team detail view displaying members and members-only invite link.

# -----------------------------------------------------------------------
# T3 public voting routes; statuses vary with the target event's OPEN/AUTH
# mode and voting window. Anonymous browser POSTs also require CSRF tokens.
# -----------------------------------------------------------------------
voting_ballot:
  declared: true
  path: /vote/{event_slug}
  method: GET
  auth: open_or_authenticated_by_event
  personas:
    anonymous: 200 in OPEN; 401 in AUTH
    participant: 200
    judge: 200
    organizer: 200
  note: Ballot order and remaining budget come from services.voting.get_ballot.

voting_cast:
  declared: true
  path: /vote/{event_slug}/{project_id}
  method: POST
  auth: open_or_authenticated_by_event; organizers cannot vote
  personas:
    anonymous: accepted in OPEN with CSRF; 401 in AUTH
    participant: accepted or a recorded rejection
    judge: accepted or a recorded rejection
    organizer: 403
  note: Every eligible voting attempt is recorded, including rate, budget, duplicate, and closed rejections.

voting_withdraw:
  declared: true
  path: /vote/{event_slug}/{project_id}/withdraw
  method: POST
  auth: voter_identity_for_event; organizers cannot vote
  personas:
    anonymous: OPEN only, with CSRF
    participant: own OPEN/AUTH vote only
    judge: own OPEN/AUTH vote only
    organizer: 403
  note: Withdrawal is only available while the voting window is open and frees budget.

voting_results:
  declared: true
  path: /results/{event_slug}
  method: GET
  auth: organizer_any_time; public_after_close
  personas:
    anonymous: 200 hidden HTML while open or when close is null; 200 after close (JSON is 401 while hidden)
    participant: 200 hidden HTML while open; 200 after close (JSON is 403 while hidden)
    judge: 200 hidden HTML while open; 200 after close (JSON is 403 while hidden)
    organizer: 200
  note: Each response calls services.voting.get_results; no cache or alternate tally path.

project_comment_create:
  declared: true
  path: /projects/{id}/comments
  method: POST
  auth: open_or_authenticated_by_event
  personas:
    anonymous: accepted in OPEN with CSRF; 401 in AUTH
    participant: accepted or rate limited
    judge: accepted or rate limited
    organizer: 403
  note: Public comments are escaped on project detail; flagged comments are hidden.

organizer_comment_flag:
  declared: true
  path: /api/v1/organizer/comments/{id}/flag
  method: POST
  auth: organizer
  personas:
    anonymous: 401
    participant: 403
    judge: 403
    organizer: 200
  note: flagged=false unflags; comments are retained and both changes are audited.

organizer_voting_summary:
  declared: true
  path: /api/v1/organizer/voting/summary
  method: GET
  auth: organizer
  personas:
    anonymous: 401
    participant: 403
    judge: 403
    organizer: 200
  note: One response includes counts per attempt outcome and per project for verification.

organizer_voting_open_now:
  declared: true
  path: /organizer/events/{event_id}/voting/open-now
  method: POST
  auth: organizer_for_target_event
  personas:
    anonymous: 401
    participant: 403
    judge: 403
    organizer: 302 after opening and audit
  note: Sets voting_opens_at to now and preserves the configured voting close time and submissions deadline.

organizer_voting_close_now:
  declared: true
  path: /organizer/events/{event_id}/voting/close-now
  method: POST
  auth: organizer_for_target_event
  personas:
    anonymous: 401
    participant: 403
    judge: 403
    organizer: 302 after closing and audit
  note: Sets voting_closes_at to now and preserves voting open time and submissions deadline.
