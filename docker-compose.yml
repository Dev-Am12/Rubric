services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rubric
      POSTGRES_USER: rubric
      POSTGRES_PASSWORD: rubric_dev_only
    volumes:
      - rubric_dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rubric"]
      interval: 2s
      timeout: 3s
      retries: 20

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://rubric:rubric_dev_only@db:5432/rubric
      DJANGO_SECRET_KEY: dev-only-not-for-production
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "*"

volumes:
  rubric_dbdata:
